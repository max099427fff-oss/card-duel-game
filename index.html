<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>معركة البطاقات</title>
<style>
:root{--cw:min(15vw,12.5vh);--bg:#0b1020;--pn:#151c33;--ac:#38e1ff;--ac2:#ffb347;--tx:#e9eefc;--rd:#ff5d6c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;border-radius:10px;background:#26335c;padding:10px 14px;min-height:44px}
button:active{filter:brightness(1.3)}
button.pri{background:linear-gradient(135deg,#1fb5d6,#3a6df0)}
button.warn{background:#7a2a38}
button:disabled{opacity:.4}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) 10px 6px}
.scr.on{display:flex}
#menu{align-items:center;justify-content:center;gap:10px;text-align:center}
#menu h1{margin:0;font-size:28px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
#menu .b{width:min(320px,80vw)}
.coins{font-weight:700;color:var(--ac2)}
#bld{position:fixed;left:4px;bottom:2px;font:9px monospace;opacity:.45;z-index:50;pointer-events:none;direction:ltr}
#qa{position:fixed;left:4px;top:2px;font:9px monospace;color:#9f9;z-index:50;pointer-events:none;white-space:pre;direction:ltr}
/* duel */
#duel{padding:0;justify-content:space-between}
.info{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 10px;background:var(--pn);font-size:13px;min-height:28px}
.lp{font-weight:800;font-size:17px;direction:ltr;min-width:76px}
.lp.f{animation:fl .5s}
@keyframes fl{0%{color:var(--rd);transform:scale(1.25)}100%{color:inherit;transform:none}}
.row{display:flex;justify-content:center;gap:calc(var(--cw)*.08);direction:ltr}
.field{display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0}
.slot{width:var(--cw);height:calc(var(--cw)*1.4);border:1px dashed #33406e;border-radius:6px;display:flex;align-items:center;justify-content:center;position:relative}
.slot.tz{height:calc(var(--cw)*.62);width:calc(var(--cw)*.9)}
.slot.hl{border:2px solid var(--ac);box-shadow:0 0 10px var(--ac)}
.slot.sel{border:2px solid var(--ac2);box-shadow:0 0 10px var(--ac2)}
.card{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:6px;font-size:calc(var(--cw)*.13);display:flex;flex-direction:column;justify-content:space-between;padding:2px 3px;position:relative;overflow:hidden;border:2px solid #000a;text-align:center;line-height:1.1;color:#fff;flex:0 0 auto}
.card .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.85em}
.card .e{font-size:2.3em;line-height:1}
.card .st{font-size:.8em;direction:ltr;font-weight:700;display:flex;justify-content:space-between}
.card .lv{font-size:.75em;color:#ffe27a}
.t-m{background:linear-gradient(160deg,#a8631e,#4a2a10)}
.t-s{background:linear-gradient(160deg,#16967c,#0b4a47)}
.t-t{background:linear-gradient(160deg,#a02a8c,#4a1050)}
.A-ماء{box-shadow:inset 0 0 0 2px #3a8dff}.A-نار{box-shadow:inset 0 0 0 2px #ff5d2e}.A-أرض{box-shadow:inset 0 0 0 2px #9a7b3a}.A-ريح{box-shadow:inset 0 0 0 2px #7be3a0}.A-ظلام{box-shadow:inset 0 0 0 2px #8a55d6}.A-نور{box-shadow:inset 0 0 0 2px #ffe27a}.A-حديد{box-shadow:inset 0 0 0 2px #c0c8d8}
.back{background:repeating-linear-gradient(45deg,#1a2b66,#1a2b66 6px,#223a85 6px,#223a85 12px);border:2px solid #7da0ff}
.card.def{transform:rotate(90deg) scale(.72)}
.card.hit{animation:hit .4s}
@keyframes hit{0%,100%{filter:none}30%{filter:brightness(2.2) saturate(2)}}
.small{width:calc(var(--cw)*.8);height:calc(var(--cw)*.54);font-size:calc(var(--cw)*.2);justify-content:center}
.small .e{font-size:1.6em}
#mid{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 8px;min-height:36px;font-size:12px;background:#10162b}
#log{flex:1;line-height:1.3;max-height:36px;overflow:hidden}
#turn{font-weight:700;color:var(--ac)}
#modebar{display:none;align-items:center;justify-content:space-between;gap:6px;padding:3px 8px;background:#3a2e10;font-size:13px}
#modebar.on{display:flex}
#hand{display:flex;gap:calc(var(--cw)*.06);padding:3px 6px 4px;overflow-x:auto;direction:ltr;min-height:calc(var(--cw)*1.4 + 8px);justify-content:safe center}
#hand .card.sel{transform:translateY(-8px);outline:2px solid var(--ac2)}
#hand .card.off{opacity:.55}
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30;padding:10px}
.ov.on{display:flex}
.sheet{background:var(--pn);border-radius:14px;padding:12px;max-width:min(560px,96vw);max-height:94vh;overflow:auto;display:flex;gap:12px;align-items:flex-start}
.sheet .big{--cw:min(34vw,26vh,150px)}
.sheet .txt{flex:1;min-width:0;font-size:14px;line-height:1.5}
.sheet .btns{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sheet h3{margin:0 0 4px}
.scrl{overflow-y:auto;flex:1;padding:4px 0}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.item{background:var(--pn);border-radius:10px;padding:6px;display:flex;gap:8px;align-items:center}
.item .card{--cw:56px}
.item .meta{flex:1;font-size:12px;line-height:1.35}
.item .cnt{display:flex;flex-direction:column;gap:4px;align-items:center}
.item.lock{opacity:.8}
.item.lock .card{filter:grayscale(.8) brightness(.6)}
.cntb{padding:2px 10px;min-height:32px}
#end h2{margin:0 0 8px}
.rules{font-size:14px;line-height:1.6;max-height:70vh;overflow:auto}
.rules li{margin-bottom:4px}
</style>
</head>
<body>
<div id="app">
<div id="menu" class="scr on">
  <h1>معركة البطاقات</h1>
  <div class="coins">🪙 <span id="mcoins">0</span> عملة</div>
  <button class="b pri" id="bAI">⚔️ العب ضد الكمبيوتر</button>
  <button class="b" id="bOn" disabled>🌐 أونلاين مع صديق (قريباً)</button>
  <button class="b" id="bDeck">🃏 رتّب دك البطاقات</button>
  <button class="b" id="bShop">🛒 المتجر</button>
  <button class="b" id="bRules">📖 طريقة اللعب</button>
  <div style="font-size:11px;opacity:.6;max-width:320px">الوحوش والأسماء والرسومات أصلية في هذه اللعبة، وليست بطاقات رسمية من أي لعبة أو أنمي.</div>
</div>
<div id="duel" class="scr">
  <div class="info" id="oinfo"></div>
  <div class="field" id="ofield"><div class="row" id="otz"></div><div class="row" id="omz"></div></div>
  <div id="mid"><div id="log"></div><div id="turn"></div><button id="bEnd" class="pri" style="min-height:34px;padding:4px 12px">إنهاء الدور</button></div>
  <div class="field" id="mfield"><div class="row" id="mmz"></div><div class="row" id="mtz"></div></div>
  <div class="info" id="minfo"></div>
  <div id="modebar"><span id="modetxt"></span><span><button id="modeOk" class="pri" style="min-height:32px;padding:2px 10px">تأكيد</button> <button id="modeX" style="min-height:32px;padding:2px 10px">إلغاء</button></span></div>
  <div id="hand"></div>
</div>
<div id="shop" class="scr"><div class="top"><button id="shopBack">رجوع</button><b>المتجر</b><span class="coins">🪙 <span id="scoins"></span></span></div><div class="scrl"><div class="grid" id="shopGrid"></div></div></div>
<div id="deckb" class="scr"><div class="top"><button id="deckBack">رجوع</button><b>الدك: <span id="deckN"></span>/40</b><button id="deckAuto">تلقائي</button></div><div class="scrl"><div class="grid" id="deckGrid"></div></div></div>
</div>
<div class="ov" id="sheetOv"><div class="sheet" id="sheet"></div></div>
<div class="ov" id="trapOv"><div class="sheet" id="trapSheet" style="flex-direction:column"></div></div>
<div class="ov" id="end"><div class="sheet" style="flex-direction:column;text-align:center"><div id="endBody"></div></div></div>
<div class="ov" id="rulesOv"><div class="sheet" style="flex-direction:column"><div class="rules" id="rulesBody"></div><button id="rulesX" class="pri">تمام</button></div></div>
<div id="bld"></div><div id="qa"></div>
<script id="engine">
